container": "#956e00" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "2rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "margin": "1.25rem", "gutter": "1rem", "space-md": "1rem" }, "fontFamily": { "title-md": ["Inter"], "headline-sm": ["Inter"], "body-md": ["Inter"], "label-lg": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "headline-md": ["Inter"], "body-sm": ["Inter"], "headline-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "title-lg": ["Inter"] }, "fontSize": { "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-lg-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-lg": ["18px", { "lineHeight": "26px", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full px-margin bg-surface"><div class="flex flex-col w-full pb-safe">
<!-- Subtle Top Decorative Glow -->
<div class="relative w-full overflow-hidden flex flex-col items-center pt-space-xs pb-space-sm">
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-64 h-32 bg-primary-fixed/40 blur-3xl rounded-full pointer-events-none"></div>
<!-- Brand Header -->
<div class="flex items-center gap-space-xs mb-space-md z-10">
<div class="relative flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-[#3b82f6] to-[#1d4ed8] shadow-md shadow-primary/20"><span class="material-symbols-outlined text-white text-[22px]">menu_book</span><div class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-secondary-fixed rounded-full flex items-center justify-center border-2 border-surface"><span class="material-symbols-outlined text-on-secondary-fixed text-[9px] font-bold">auto_awesome</span></div></div>
<div class="flex flex-col">
<span class="font-title-lg text-title-lg text-on-surface tracking-tight">StudyMate</span>
<span class="font-label-sm text-label-sm text-primary -mt-1 font-semibold">Smart Exam Prep</span>
</div>
</div>
<!-- Segmented Tab Control -->
<div class="w-full bg-surface-container p-1 rounded-full flex relative z-10 shadow-inner">
<button class="flex-1 py-2 text-center rounded-full font-label-lg text-label-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm" id="tab-signin" type="button">
        Sign In
      </button>
<button class="flex-1 py-2 text-center rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface" id="tab-signup" type="button">
        Create Account
      </button>
</div>
</div>
<!-- Dynamic Header Text -->
<div class="flex flex-col mt-space-md mb-space-lg text-left">
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container-high w-fit mb-space-xs">
<span class="w-2 h-2 rounded-full bg-secondary-container animate-pulse"></span>
<span class="font-label-sm text-label-sm text-secondary font-medium">Matric • FSc • O/A-Levels</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface" id="view-title">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1" id="view-subtitle">
      Sign in to access your notes, quizzes, and revision material.
    </p>
</div>
<!-- Main Card Container -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-md">
<!-- Extra Field for Sign Up (Hidden by Default) -->
<div class="hidden flex-col gap-1.5" id="field-name-container">
<label class="font-label-md text-label-md text-on-surface" for="full-name">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined text-outline text-[20px] absolute left-3 pointer-events-none">person</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-10 pr-4 py-3 rounded-lg focus:outline-none focus:bg-surface-container-lowest transition-all" id="full-name" placeholder="e.g. Ayesha Khan" type="text">
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email-address">Email address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined text-outline text-[20px] absolute left-3 pointer-events-none">mail</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-10 pr-4 py-3 rounded-lg focus:outline-none focus:bg-surface-container-lowest transition-all" id="email-address" placeholder="name@example.com" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password-input">Password</label>
<button class="font-label-md text-label-md text-primary font-semibold hover:underline" id="btn-forgot-password" type="button">
          Forgot password?
        </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined text-outline text-[20px] absolute left-3 pointer-events-none">lock</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-10 pr-11 py-3 rounded-lg focus:outline-none focus:bg-surface-container-lowest transition-all" id="password-input" placeholder="Enter your password" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 p-1 flex items-center justify-center text-outline hover:text-on-surface" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full mt-space-xs bg-primary-container text-on-primary-container font-label-lg text-label-lg py-3 rounded-lg flex items-center justify-center gap-2 shadow-sm active:scale-[0.98] transition-transform duration-100" id="btn-submit" type="button">
<span id="btn-submit-text" class="">Sign in</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Visual Divider -->
<div class="relative flex items-center justify-center my-space-xs">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-px bg-surface-container-high"></div>
</div>
<span class="relative px-3 bg-surface-container-lowest font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">
        Or continue with
      </span>
</div>
<!-- Social Authentication Options -->
<button class="w-full py-3 px-4 rounded-xl bg-surface-container-low text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-3 active:scale-[0.98] transition-all hover:bg-surface-container" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.04 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="">Continue with Google</span>
</button>
</div>
<!-- Micro Delight Study Streak Snapshot -->

<!-- Terms and Compliance Footer -->
<div class="mt-space-lg mb-space-md text-center px-space-xs">
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
      By continuing, you agree to StudyMate's 
      <a class="text-primary font-medium hover:underline" href="#">Terms of Service</a> 
      and 
      <a class="text-primary font-medium hover:underline" href="#">Privacy Policy</a>.
    </p>
</div>
</div>
<script>
  (function() {
    const tabSignIn = document.getElementById('tab-signin');
    const tabSignUp = document.getElementById('tab-signup');
    const nameField = document.getElementById('field-name-container');
    const viewTitle = document.getElementById('view-title');
    const viewSubtitle = document.getElementById('view-subtitle');
    const btnSubmitText = document.getElementById('btn-submit-text');
    const btnForgot = document.getElementById('btn-forgot-password');
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password-input');
    const eyeIcon = document.getElementById('eye-icon');

    // Tab Switch Actions
    function setSignInMode() {
      tabSignIn.className = 'flex-1 py-2 text-center rounded-full font-label-lg text-label-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm';
      tabSignUp.className = 'flex-1 py-2 text-center rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface';
      nameField.classList.add('hidden');
      btnForgot.classList.remove('invisible');
      viewTitle.textContent = 'Welcome back';
      viewSubtitle.textContent = 'Sign in to access your notes, quizzes, and revision material.';
      btnSubmitText.textContent = 'Sign in';
    }

    function setSignUpMode() {
      tabSignUp.className = 'flex-1 py-2 text-center rounded-full font-label-lg text-label-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm';
      tabSignIn.className = 'flex-1 py-2 text-center rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface';
      nameField.classList.remove('hidden');
      btnForgot.classList.add('invisible');
      viewTitle.textContent = 'Create Account';
      viewSubtitle.textContent = 'Join thousands of students mastering their exams with StudyMate.';
      btnSubmitText.textContent = 'Create free account';
    }

    tabSignIn.addEventListener('click', setSignInMode);
    tabSignUp.addEventListener('click', setSignUpMode);

    // Password Visibility Toggle
    togglePassword.addEventListener('click', function() {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  })();
</script></main>

</body></html>
